  <rect class="ph" x="100" y="998" width="220" height="24"/>
  <text class="wm" x="108" y="1016">Explore the Network</text>
  <text class="mono" x="100" y="1070">Explore ↗</text>
  <!-- iso map placeholder (diamond) -->
  <polygon points="490,1010 600,1070 490,1130 380,1070" fill="#ececec" stroke="#d2d2d2"/>
  <line class="hatch" x1="380" y1="1070" x2="600" y2="1070"/>
  <line class="hatch" x1="490" y1="1010" x2="490" y2="1130"/>
  <text class="imglbl" x="490" y="1074" text-anchor="middle" font-size="10">ISO PORT-MAP</text>
  <text class="anh" x="650" y="990">Explore the Network</text>
  <text class="an" x="650" y="1012">Arsenal-1's iso site-map → the live</text>
  <text class="an" x="650" y="1030">port-map / tracking globe. Heading +</text>
  <text class="an" x="650" y="1048">iso render + "Explore ↗" link.</text>
  <text class="flag" x="650" y="1074">QR code removed (was Arsenal-1)</text>
  <text class="anh" x="650" y="1100">CD ASSET → iso port-map / globe</text>
  <text class="sub" x="650" y="1122">(the site's single best visual)</text>

  <!-- ============ 05 PARTNER CTA ============ -->
  <text class="rail" x="34" y="1234">05</text>
  <rect class="frame" x="80" y="1206" width="540" height="160"/>
  <rect class="tab" x="80" y="1206" width="158" height="22"/>
  <text class="tabtxt" x="90" y="1221">05 · PARTNER CTA</text>
  <rect class="ph" x="100" y="1242" width="340" height="44"/>
  <text class="wm" x="108" y="1269">Shape the future of global freight</text>
  <rect class="line" x="100" y="1302" width="380" height="6"/>
  <rect class="line" x="100" y="1316" width="320" height="6"/>
  <rect class="btn" x="100" y="1330" width="128" height="28"/>
  <text class="lbl" x="114" y="1348">Partner With Relai</text>
  <text class="anh" x="650" y="1234">Partner CTA (Arsenal-1)</text>
  <text class="an" x="650" y="1256">Large heading + paragraph + button.</text>
  <text class="an" x="650" y="1274">Black block. Copy swap.</text>

