  <line class="hatch" x1="100" y1="800" x2="340" y2="920"/>
  <line class="hatch" x1="340" y1="800" x2="100" y2="920"/>
  <text class="imglbl" x="220" y="862" text-anchor="middle" font-size="10">IMAGE</text>
  <rect class="img" x="360" y="800" width="240" height="120"/>
  <line class="hatch" x1="360" y1="800" x2="600" y2="920"/>
  <line class="hatch" x1="600" y1="800" x2="360" y2="920"/>
