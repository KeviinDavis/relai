  <rect class="line" x="100" y="1470" width="360" height="6"/>
  <rect class="btn" x="100" y="1484" width="160" height="26"/>
  <text class="lbl" x="114" y="1501">Join Our Talent Network</text>
  <text class="mono" x="100" y="1534">WE ARE HIRING — ROLES</text>
  <!-- role rows -->
  <line x1="100" y1="1546" x2="600" y2="1546" stroke="#e0e0e0"/>
  <text class="mono" x="100" y="1566">01</text><rect class="line" x="150" y="1558" width="200" height="6"/>
  <line x1="100" y1="1578" x2="600" y2="1578" stroke="#e0e0e0"/>
  <text class="mono" x="100" y="1598">02</text><rect class="line" x="150" y="1590" width="220" height="6"/>
  <line x1="100" y1="1610" x2="600" y2="1610" stroke="#e0e0e0"/>
  <text class="mono" x="100" y="1630">03</text><rect class="line" x="150" y="1622" width="180" height="6"/>
  <line x1="100" y1="1642" x2="600" y2="1642" stroke="#e0e0e0"/>
  <text class="anh" x="650" y="1418">Careers block (Arsenal-1)</text>
  <text class="an" x="650" y="1440">"Stay On Our Radar" + talent CTA +</text>
  <text class="an" x="650" y="1458">numbered roles 01–06. The page's</text>
  <text class="an" x="650" y="1476">hard black→white seam.</text>
  <text class="flag" x="650" y="1502">invent 6 logistics/eng roles (TODO)</text>
  <text class="flag" x="650" y="1518">or drop if Relai isn't "hiring"</text>

  <!-- ============ 07 CONTACT / FOOTER ============ -->
  <text class="rail" x="34" y="1688">07</text>
  <rect class="frame" x="80" y="1660" width="540" height="240"/>
  <rect class="tab" x="80" y="1660" width="252" height="22"/>
