<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1940" viewBox="0 0 1000 1940" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill:#ffffff; stroke:#cfcfcf; stroke-width:1; }
    .surface { fill:#f3f2ee; stroke:#cfcfcf; stroke-width:1; }
    .light { fill:#ffffff; stroke:#bdbdbd; stroke-width:1.5; }
    .ph { fill:#dcdcdc; }
    .line { fill:#e4e4e4; }
    .btn { fill:#ffffff; stroke:#9a9a9a; stroke-width:1; }
    .img { fill:#ececec; }
    .hatch { stroke:#d2d2d2; stroke-width:1; }
    .tab { fill:#111111; }
    .tabtxt { fill:#ffffff; font-size:12px; font-weight:bold; letter-spacing:1px; font-family:monospace; }
    .chip { fill:none; stroke:#9a9a9a; stroke-width:1; }
    .chiptxt { fill:#555; font-size:10px; letter-spacing:1px; font-family:monospace; }
    .newchip { fill:#1a1a1a; }
    .newtxt { fill:#fff; font-size:10px; letter-spacing:1px; font-family:monospace; }
    .rail { fill:#e8e8e8; font-size:30px; font-weight:bold; }
    .mono { font-family:monospace; fill:#777; font-size:11px; }
    .lbl { fill:#666; font-size:11px; }
    .imglbl { fill:#8a8a8a; font-size:11px; letter-spacing:1px; }
    .anh { fill:#1a1a1a; font-size:12px; font-weight:bold; }
    .an { fill:#5a5a5a; font-size:12px; }
    .sub { fill:#9a9a9a; font-size:11px; }
    .title { fill:#111; font-size:22px; font-weight:bold; }
    .wm { fill:#888; font-size:13px; font-weight:bold; }
    .flag { fill:#9a6a1a; font-size:11px; font-style:italic; }
    .bignum { fill:#cfcfcf; font-size:26px; font-weight:bold; }
  </style>

  <!-- HEADER -->
  <text class="title" x="40" y="40">RELAI — MISSION</text>
  <text class="sub" x="40" y="62">Anduril "Arsenal-1" structure, Relai-translated · neutral wireframe</text>
  <rect class="chip" x="370" y="26" width="118" height="22"/>
  <text class="chiptxt" x="382" y="41">PAGE THEME · BLACK</text>
  <line x1="40" y1="86" x2="985" y2="86" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ 01 HERO ============ -->
  <text class="rail" x="34" y="138">01</text>
  <rect class="frame" x="80" y="110" width="540" height="360"/>
  <rect class="tab" x="80" y="110" width="132" height="22"/>
  <text class="tabtxt" x="90" y="125">01 · HERO</text>
  <text class="mono" x="100" y="158">RELAI</text>
  <text class="mono" x="560" y="158">Menu</text>
  <rect class="ph" x="100" y="228" width="300" height="56"/>
  <text class="wm" x="112" y="262">WORDMARK · "The Relai Mission"</text>
  <text class="mono" x="100" y="306">BUILT AT THE PORT OF LONG BEACH</text>
  <text class="mono" x="100" y="356">[ MISSION ]</text>
  <rect class="line" x="250" y="344" width="200" height="6"/>
  <rect class="line" x="250" y="356" width="160" height="6"/>
  <text class="lbl" x="596" y="358">↓</text>
  <line x1="80" y1="378" x2="620" y2="378" stroke="#bdbdbd" stroke-width="2"/>
  <rect class="img" x="80" y="378" width="540" height="92"/>
  <line class="hatch" x1="80" y1="378" x2="620" y2="470"/>
  <line class="hatch" x1="620" y1="378" x2="80" y2="470"/>
  <text class="imglbl" x="350" y="428" text-anchor="middle">MEDIA · video — port at dusk</text>
  <text class="anh" x="650" y="124">Hero (dynamic component)</text>
  <text class="an" x="650" y="146">Mono sub-label = the "Built in Ohio"</text>
  <text class="an" x="650" y="164">slot → flagship port. No CTAs.</text>
  <text class="mono" x="650" y="190">tag: [ MISSION ] · media: video</text>
  <text class="flag" x="650" y="214">confirm sub-label: Long Beach vs</text>
  <text class="flag" x="650" y="230">"Engineered in San Pedro Bay"</text>

  <!-- ============ 02 STAT BAND ============ -->
  <text class="rail" x="34" y="522">02</text>
  <rect class="frame" x="80" y="494" width="540" height="250"/>
  <rect class="tab" x="80" y="494" width="120" height="22"/>
  <text class="tabtxt" x="90" y="509">02 · STAT BAND</text>
  <rect class="newchip" x="206" y="494" width="40" height="22"/>
  <text class="newtxt" x="213" y="509">NEW</text>
  <rect class="ph" x="190" y="528" width="320" height="26"/>
  <text class="wm" x="200" y="547">THE MISSION IN NUMBERS</text>
  <!-- stat rows -->
  <line x1="100" y1="572" x2="600" y2="572" stroke="#ddd"/>
  <text class="bignum" x="100" y="600">‹920 hrs›</text>
  <text class="sub" x="100" y="616">idle / waiting</text>
  <rect class="line" x="360" y="588" width="230" height="6"/>
  <rect class="line" x="360" y="600" width="200" height="6"/>
  <line x1="100" y1="630" x2="600" y2="630" stroke="#ddd"/>
  <text class="bignum" x="100" y="658">‹68%›</text>
  <text class="sub" x="100" y="674">on legacy systems</text>
  <rect class="line" x="360" y="646" width="220" height="6"/>
  <rect class="line" x="360" y="658" width="190" height="6"/>
  <line x1="100" y1="688" x2="600" y2="688" stroke="#ddd"/>
  <text class="bignum" x="100" y="716">‹1.2M›</text>
  <text class="sub" x="100" y="732">containers / yr</text>
  <rect class="line" x="360" y="704" width="210" height="6"/>
  <rect class="line" x="360" y="716" width="180" height="6"/>
  <text class="anh" x="650" y="522">Stat band — mission in numbers</text>
  <text class="an" x="650" y="544">Arsenal-1's stat rows. Big number +</text>
  <text class="an" x="650" y="562">label left, paragraph right, hairline</text>
  <text class="an" x="650" y="580">divided. The "drama" beat Mission</text>
  <text class="an" x="650" y="598">was missing.</text>
  <text class="flag" x="650" y="624">all numbers placeholder ‹ › — write</text>
  <text class="flag" x="650" y="640">the real stat copy (deck TODO)</text>

