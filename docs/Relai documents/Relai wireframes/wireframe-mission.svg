  <text class="an" x="650" y="818">Two full-bleed port/terminal</text>
  <text class="an" x="650" y="836">photos. Sourced, dusk register.</text>

  <!-- ============ 04 EXPLORE NETWORK ============ -->
  <text class="rail" x="34" y="990">04</text>
  <rect class="frame" x="80" y="962" width="540" height="220"/>
  <rect class="tab" x="80" y="962" width="206" height="22"/>
