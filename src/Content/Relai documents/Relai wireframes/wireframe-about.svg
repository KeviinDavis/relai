  <rect class="line" x="100" y="502" width="430" height="6"/>
  <rect class="line" x="100" y="524" width="450" height="6"/>
  <rect class="line" x="100" y="540" width="380" height="6"/>
  <text class="anh" x="650" y="472">Hero body (inherited)</text>
  <text class="an" x="650" y="494">Two-paragraph block. Copy swap.</text>

  <!-- ============ 03 WHY RELAI / FOUNDING ============ -->
  <text class="rail" x="34" y="622">03</text>
  <rect class="frame" x="80" y="594" width="540" height="170"/>
  <rect class="tab" x="80" y="594" width="206" height="22"/>
  <text class="tabtxt" x="90" y="609">03 · WHY RELAI / FOUNDING</text>
  <rect class="ph" x="100" y="626" width="220" height="20"/>
  <rect class="line" x="100" y="658" width="220" height="6"/>
  <rect class="line" x="100" y="672" width="200" height="6"/>
  <rect class="line" x="100" y="686" width="180" height="6"/>
  <rect class="img" x="360" y="626" width="240" height="118"/>
  <line class="hatch" x1="360" y1="626" x2="600" y2="744"/>
  <line class="hatch" x1="600" y1="626" x2="360" y2="744"/>
  <text class="imglbl" x="480" y="688" text-anchor="middle" font-size="10">IMAGE</text>
  <text class="anh" x="650" y="622">Founding story (inherited)</text>
  <text class="an" x="650" y="644">"Bridging the supply chain…" —</text>
  <text class="an" x="650" y="662">2022, Port of Long Beach anchor.</text>
  <text class="an" x="650" y="680">Copy swap + image.</text>

