  <rect class="card" x="100" y="858" width="110" height="150"/>
  <rect class="img" x="110" y="868" width="90" height="90"/>
  <line class="hatch" x1="110" y1="868" x2="200" y2="958"/>
  <line class="hatch" x1="200" y1="868" x2="110" y2="958"/>
  <rect class="line" x="110" y="970" width="80" height="6"/>
  <rect class="line" x="110" y="984" width="60" height="5"/>
  <rect class="card" x="230" y="858" width="110" height="150"/>
  <rect class="img" x="240" y="868" width="90" height="90"/>
  <line class="hatch" x1="240" y1="868" x2="330" y2="958"/>
  <line class="hatch" x1="330" y1="868" x2="240" y2="958"/>
  <rect class="line" x="240" y="970" width="80" height="6"/>
  <rect class="line" x="240" y="984" width="60" height="5"/>
  <rect class="card" x="360" y="858" width="110" height="150"/>
  <rect class="img" x="370" y="868" width="90" height="90"/>
  <line class="hatch" x1="370" y1="868" x2="460" y2="958"/>
  <line class="hatch" x1="460" y1="868" x2="370" y2="958"/>
  <rect class="line" x="370" y="970" width="80" height="6"/>
  <rect class="line" x="370" y="984" width="60" height="5"/>
  <rect class="card" x="490" y="858" width="110" height="150"/>
  <rect class="img" x="500" y="868" width="90" height="90"/>
  <line class="hatch" x1="500" y1="868" x2="590" y2="958"/>
  <line class="hatch" x1="590" y1="868" x2="500" y2="958"/>
  <rect class="line" x="500" y="970" width="80" height="6"/>
  <rect class="line" x="500" y="984" width="60" height="5"/>
  <text class="anh" x="650" y="816">Leadership (NEW component)</text>
  <text class="an" x="650" y="838">4 cards: portrait + name + role.</text>
  <text class="an" x="650" y="856">Placed after founding, before</text>
  <text class="an" x="650" y="874">mission teaser. Light cards (page</text>
  <text class="an" x="650" y="892">is white — inverted from surface).</text>
  <text class="anh" x="650" y="918">CD ASSET → 4 portraits</text>
  <text class="flag" x="650" y="940">treatment TBD: stylized / placeholder</text>
  <text class="flag" x="650" y="956">/ AI — avoid raw stock faces</text>
  <text class="flag" x="650" y="978">invent 4 names + roles (TODO)</text>

  <!-- ============ 05 MISSION TEASER ============ -->
  <text class="rail" x="34" y="1080">05</text>
  <rect class="frame" x="80" y="1052" width="540" height="170"/>
  <rect class="tab" x="80" y="1052" width="172" height="22"/>
  <text class="tabtxt" x="90" y="1067">05 · MISSION TEASER</text>
  <rect class="ph" x="100" y="1084" width="320" height="24"/>
  <text class="wm" x="108" y="1102">A total transformation of freight</text>
  <rect class="line" x="100" y="1126" width="380" height="6"/>
  <rect class="line" x="100" y="1140" width="320" height="6"/>
  <text class="mono" x="100" y="1170">Read our mission →</text>
  <rect class="img" x="380" y="1084" width="220" height="120"/>
  <line class="hatch" x1="380" y1="1084" x2="600" y2="1204"/>
