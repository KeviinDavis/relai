  <text class="mono" x="100" y="1462">Home · Product · FAQ · About · Contact</text>
  <text class="mono" x="540" y="1462">© Relai</text>
  <text class="anh" x="650" y="1274">Shared sections (all pages)</text>
  <text class="an" x="650" y="1296">Theme inherited — WHITE here, so</text>
  <text class="an" x="650" y="1314">these render light on About.</text>
