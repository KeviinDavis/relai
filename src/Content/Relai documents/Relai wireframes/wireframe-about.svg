  <text class="rail" x="34" y="816">04</text>
  <rect class="frame" x="80" y="788" width="540" height="240"/>
  <rect class="tab" x="80" y="788" width="148" height="22"/>
  <text class="tabtxt" x="90" y="803">04 · LEADERSHIP</text>
  <rect class="newchip" x="234" y="788" width="40" height="22"/>
