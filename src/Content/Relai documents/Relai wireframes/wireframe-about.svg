<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1520" viewBox="0 0 1000 1520" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill:#ffffff; stroke:#cfcfcf; stroke-width:1; }
    .light { fill:#ffffff; stroke:#bdbdbd; stroke-width:1.5; }
    .card { fill:#fafafa; stroke:#d6d6d6; stroke-width:1; }
    .ph { fill:#dcdcdc; }
    .line { fill:#e4e4e4; }
    .btn { fill:#ffffff; stroke:#9a9a9a; stroke-width:1; }
    .img { fill:#ececec; }
    .hatch { stroke:#d2d2d2; stroke-width:1; }
    .tab { fill:#111111; }
    .tabtxt { fill:#ffffff; font-size:12px; font-weight:bold; letter-spacing:1px; font-family:monospace; }
    .chip { fill:none; stroke:#9a9a9a; stroke-width:1; }
    .chiptxt { fill:#555; font-size:10px; letter-spacing:1px; font-family:monospace; }
    .newchip { fill:#1a1a1a; }
    .newtxt { fill:#fff; font-size:10px; letter-spacing:1px; font-family:monospace; }
    .rail { fill:#e8e8e8; font-size:30px; font-weight:bold; }
    .mono { font-family:monospace; fill:#777; font-size:11px; }
    .lbl { fill:#666; font-size:11px; }
    .imglbl { fill:#8a8a8a; font-size:11px; letter-spacing:1px; }
    .anh { fill:#1a1a1a; font-size:12px; font-weight:bold; }
    .an { fill:#5a5a5a; font-size:12px; }
    .sub { fill:#9a9a9a; font-size:11px; }
    .title { fill:#111; font-size:22px; font-weight:bold; }
    .wm { fill:#888; font-size:13px; font-weight:bold; }
    .flag { fill:#9a6a1a; font-size:11px; font-style:italic; }
  </style>

  <!-- HEADER -->
  <text class="title" x="40" y="40">RELAI — ABOUT</text>
  <text class="sub" x="40" y="62">White page · opts out of the dynamic hero · includes new leadership component</text>
  <rect class="chip" x="470" y="26" width="118" height="22"/>
  <text class="chiptxt" x="482" y="41">PAGE THEME · WHITE</text>
  <line x1="40" y1="86" x2="985" y2="86" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ 01 HERO (own) ============ -->
  <text class="rail" x="34" y="138">01</text>
  <rect class="frame" x="80" y="110" width="540" height="310"/>
  <rect class="tab" x="80" y="110" width="178" height="22"/>
  <text class="tabtxt" x="90" y="125">01 · HERO (template own)</text>
  <text class="mono" x="100" y="158">RELAI</text>
  <text class="mono" x="560" y="158">Menu</text>
  <text class="mono" x="100" y="190">ABOUT</text>
  <rect class="ph" x="100" y="200" width="380" height="44"/>
  <text class="wm" x="108" y="227">Building the platform we wished we had</text>
  <rect class="img" x="100" y="262" width="500" height="138"/>
  <line class="hatch" x1="100" y1="262" x2="600" y2="400"/>
  <line class="hatch" x1="600" y1="262" x2="100" y2="400"/>
  <text class="imglbl" x="350" y="335" text-anchor="middle">IMAGE · architecture / port (full-bleed)</text>
  <text class="anh" x="650" y="124">Hero — template's OWN</text>
  <text class="an" x="650" y="146">NOT the dynamic component.</text>
  <text class="an" x="650" y="164">About opts out — standard heading</text>
  <text class="an" x="650" y="182">+ full-bleed image, no wordmark/tag.</text>
  <text class="an" x="650" y="208">Copy: About H1 (deck)</text>

  <!-- ============ 02 HERO BODY ============ -->
  <text class="rail" x="34" y="472">02</text>
  <rect class="frame" x="80" y="444" width="540" height="126"/>
  <rect class="tab" x="80" y="444" width="148" height="22"/>
  <text class="tabtxt" x="90" y="459">02 · HERO BODY</text>
