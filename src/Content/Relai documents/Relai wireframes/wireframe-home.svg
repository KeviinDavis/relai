<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1700" viewBox="0 0 1000 1700" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill:#ffffff; stroke:#cfcfcf; stroke-width:1; }
    .surface { fill:#f3f2ee; stroke:#cfcfcf; stroke-width:1; }
    .ph { fill:#dcdcdc; }
    .line { fill:#e4e4e4; }
    .btn { fill:#ffffff; stroke:#9a9a9a; stroke-width:1; }
    .img { fill:#ececec; }
    .hatch { stroke:#d2d2d2; stroke-width:1; }
    .tab { fill:#111111; }
    .tabtxt { fill:#ffffff; font-size:12px; font-weight:bold; letter-spacing:1px; font-family:monospace; }
    .chip { fill:none; stroke:#9a9a9a; stroke-width:1; }
    .chiptxt { fill:#555; font-size:10px; letter-spacing:1px; font-family:monospace; }
    .rail { fill:#e8e8e8; font-size:30px; font-weight:bold; font-family:Helvetica, Arial, sans-serif; }
    .mono { font-family:monospace; fill:#777; font-size:11px; }
    .lbl { fill:#666; font-size:11px; }
    .imglbl { fill:#8a8a8a; font-size:11px; letter-spacing:1px; }
    .anh { fill:#1a1a1a; font-size:12px; font-weight:bold; }
    .an { fill:#5a5a5a; font-size:12px; }
    .sub { fill:#9a9a9a; font-size:11px; }
    .title { fill:#111; font-size:22px; font-weight:bold; }
    .wm { fill:#888; font-size:13px; font-weight:bold; }
  </style>

  <!-- HEADER -->
  <text class="title" x="40" y="40">RELAI — HOME</text>
  <text class="sub" x="40" y="62">Section-stack wireframe · neutral by design (tokens carry the style)</text>
  <rect class="chip" x="300" y="26" width="118" height="22" rx="0"/>
  <text class="chiptxt" x="312" y="41">PAGE THEME · BLACK</text>
  <line x1="40" y1="86" x2="985" y2="86" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ============ 01 HERO ============ -->
  <text class="rail" x="34" y="138">01</text>
  <rect class="frame" x="80" y="110" width="540" height="390"/>
  <rect class="tab" x="80" y="110" width="132" height="22"/>
  <text class="tabtxt" x="90" y="125">01 · HERO</text>
  <!-- nav hint -->
  <text class="mono" x="100" y="158">RELAI</text>
  <text class="mono" x="560" y="158" text-anchor="start">Menu</text>
  <!-- wordmark -->
  <rect class="ph" x="100" y="250" width="320" height="60"/>
  <text class="wm" x="112" y="286">WORDMARK · "Redefining Freight"</text>
  <!-- CTAs -->
  <rect class="btn" x="100" y="322" width="128" height="28"/>
  <text class="lbl" x="114" y="340">See the Platform</text>
  <rect class="btn" x="238" y="322" width="98" height="28"/>
  <text class="lbl" x="252" y="340">Book a demo</text>
  <!-- baseline row: tag | desc | arrow -->
  <text class="mono" x="100" y="378">[ FREIGHT ]</text>
  <rect class="line" x="250" y="366" width="210" height="6"/>
  <rect class="line" x="250" y="378" width="180" height="6"/>
  <text class="lbl" x="596" y="380">↓</text>
  <!-- hard seam + media -->
  <line x1="80" y1="392" x2="620" y2="392" stroke="#bdbdbd" stroke-width="2"/>
  <rect class="img" x="80" y="392" width="540" height="108"/>
  <line class="hatch" x1="80" y1="392" x2="620" y2="500"/>
  <line class="hatch" x1="620" y1="392" x2="80" y2="500"/>
  <text class="imglbl" x="350" y="450" text-anchor="middle">MEDIA · video — port terminal at dusk</text>
  <!-- annotation -->
  <text class="anh" x="650" y="124">Hero (dynamic component)</text>
  <text class="an" x="650" y="146">Used on 4/5 pages. Align to Anduril:</text>
  <text class="an" x="650" y="164">bottom-left wordmark, baseline row,</text>
  <text class="an" x="650" y="182">hard media seam, sharp CTAs.</text>
  <text class="mono" x="650" y="208">props: wordmark · tag · description</text>
  <text class="mono" x="650" y="224">       media{video|image} · ctas[] · theme</text>
  <text class="an" x="650" y="250">Copy: H1 + hero subhead (deck)</text>

  <!-- ============ 02 WHY RELAI ============ -->
  <text class="rail" x="34" y="552">02</text>
  <rect class="frame" x="80" y="524" width="540" height="140"/>
  <rect class="tab" x="80" y="524" width="160" height="22"/>
  <text class="tabtxt" x="90" y="539">02 · WHY RELAI</text>
  <text class="mono" x="100" y="572">WHY RELAI</text>
  <rect class="line" x="100" y="588" width="430" height="6"/>
  <rect class="line" x="100" y="604" width="470" height="6"/>
  <rect class="line" x="100" y="620" width="400" height="6"/>
  <rect class="line" x="100" y="636" width="300" height="6"/>
  <text class="anh" x="650" y="552">Why Relai band (inherited)</text>
  <text class="an" x="650" y="574">Layout unchanged — copy swap only.</text>
  <text class="an" x="650" y="596">Includes the video-caption line</text>
  <text class="an" x="650" y="614">("freight has gone global…").</text>
  <text class="sub" x="650" y="640">THEME · black</text>

  <!-- ============ 03 CAPABILITIES ============ -->
  <text class="rail" x="34" y="716">03</text>
  <rect class="frame" x="80" y="688" width="540" height="280"/>
  <rect class="tab" x="80" y="688" width="260" height="22"/>
  <text class="tabtxt" x="90" y="703">03 · CAPABILITIES (01/04 TABS)</text>
  <rect class="ph" x="100" y="722" width="170" height="22"/>
  <text class="wm" x="108" y="738">Capabilities</text>
  <!-- tab row -->
  <text class="mono" x="100" y="772">Vessel Intel.</text>
  <text class="mono" x="220" y="772">Terminal</text>
  <text class="mono" x="320" y="772">Drayage</text>
  <text class="mono" x="420" y="772">Emissions</text>
  <line x1="100" y1="780" x2="195" y2="780" stroke="#111" stroke-width="2"/>
  <line x1="100" y1="784" x2="600" y2="784" stroke="#e0e0e0" stroke-width="1"/>
  <!-- surface panel -->
  <rect class="surface" x="100" y="798" width="500" height="150"/>
  <text class="mono" x="118" y="824">01 / 04</text>
  <text class="mono" x="118" y="842">VESSEL INTELLIGENCE</text>
  <rect class="line" x="180" y="858" width="230" height="7"/>
  <rect class="line" x="180" y="872" width="200" height="7"/>
  <rect class="line" x="180" y="886" width="170" height="7"/>
  <text class="ph" x="118" y="935" font-size="46" font-weight="bold">1</text>
  <rect class="img" x="430" y="816" width="152" height="116"/>
  <line class="hatch" x1="430" y1="816" x2="582" y2="932"/>
  <line class="hatch" x1="582" y1="816" x2="430" y2="932"/>
  <text class="imglbl" x="506" y="878" text-anchor="middle" font-size="10">DIAGRAM</text>
  <text class="anh" x="650" y="716">Capabilities — 01/04 tabs (Anduril)</text>
  <text class="an" x="650" y="738">Reference component. "What it is"</text>
  <text class="an" x="650" y="756">register — one statement per tab.</text>
  <text class="mono" x="650" y="782">panel bg = surface #20231F</text>
  <text class="an" x="650" y="808">Copy: 4 tab statements (deck)</text>
  <text class="anh" x="650" y="834">CD ASSET → 4 conceptual diagrams</text>
  <text class="sub" x="650" y="856">(wireframe family, one per capability)</text>

  <!-- ============ 04 TESTIMONIAL ============ -->
  <text class="rail" x="34" y="1020">04</text>
  <rect class="frame" x="80" y="992" width="540" height="160"/>
  <rect class="tab" x="80" y="992" width="150" height="22"/>
  <text class="tabtxt" x="90" y="1007">04 · TESTIMONIAL</text>
  <rect class="surface" x="100" y="1014" width="500" height="120"/>
  <rect class="line" x="120" y="1040" width="440" height="7"/>
  <rect class="line" x="120" y="1056" width="400" height="7"/>
  <rect class="line" x="120" y="1072" width="300" height="7"/>
  <rect class="ph" x="120" y="1094" width="30" height="22"/>
  <text class="lbl" x="160" y="1110">‹Marcus Vance — Pacific Gateway›</text>
  <text class="sub" x="540" y="1126">1 / 3</text>
  <text class="anh" x="650" y="1020">Testimonial (inherited)</text>
  <text class="an" x="650" y="1042">Card = surface. Swap quote +</text>
  <text class="an" x="650" y="1060">company. All placeholder ‹ › —</text>
  <text class="an" x="650" y="1078">nothing real is claimed.</text>

  <!-- ============ 05 LEARN MORE ============ -->
  <text class="rail" x="34" y="1204">05</text>
  <rect class="frame" x="80" y="1176" width="540" height="220"/>
  <rect class="tab" x="80" y="1176" width="150" height="22"/>
  <text class="tabtxt" x="90" y="1191">05 · LEARN MORE</text>
  <rect class="line" x="100" y="1212" width="430" height="6"/>
  <rect class="line" x="100" y="1226" width="380" height="6"/>
  <!-- two cards -->
  <rect class="img" x="100" y="1252" width="240" height="120"/>
  <line class="hatch" x1="100" y1="1252" x2="340" y2="1372"/>
  <line class="hatch" x1="340" y1="1252" x2="100" y2="1372"/>
  <text class="imglbl" x="220" y="1316" text-anchor="middle" font-size="10">ABOUT CARD · image</text>
  <rect class="img" x="360" y="1252" width="240" height="120"/>
  <line class="hatch" x1="360" y1="1252" x2="600" y2="1372"/>
  <line class="hatch" x1="600" y1="1252" x2="360" y2="1372"/>
  <text class="imglbl" x="480" y="1316" text-anchor="middle" font-size="10">MISSION CARD · image</text>
  <text class="anh" x="650" y="1204">Learn More (inherited)</text>
  <text class="an" x="650" y="1226">Venture-backed para + two cards</text>
  <text class="an" x="650" y="1244">linking About &amp; Mission.</text>
  <text class="an" x="650" y="1270">Copy swap. Card images sourced.</text>

  <!-- ============ 06 CONTACT / FOOTER ============ -->
  <text class="rail" x="34" y="1448">06</text>
  <rect class="frame" x="80" y="1420" width="540" height="240"/>
  <rect class="tab" x="80" y="1420" width="252" height="22"/>
  <text class="tabtxt" x="90" y="1435">06 · CONTACT / CTA / FOOTER</text>
  <rect class="ph" x="100" y="1452" width="260" height="26"/>
  <text class="wm" x="108" y="1471">The future of freight</text>
  <rect class="line" x="100" y="1492" width="420" height="6"/>
  <rect class="line" x="100" y="1506" width="360" height="6"/>
  <!-- get in touch CTA card -->
  <rect class="img" x="100" y="1528" width="500" height="80"/>
  <line class="hatch" x1="100" y1="1528" x2="600" y2="1608"/>
  <line class="hatch" x1="600" y1="1528" x2="100" y2="1608"/>
  <text class="imglbl" x="350" y="1572" text-anchor="middle" font-size="10">GET IN TOUCH · CTA card (image + text)</text>
  <!-- footer -->
  <line x1="100" y1="1628" x2="600" y2="1628" stroke="#e0e0e0" stroke-width="1"/>
  <text class="mono" x="100" y="1648">Home · Product · FAQ · About · Contact</text>
  <text class="mono" x="540" y="1648">© Relai</text>
  <text class="anh" x="650" y="1448">Contact + Get in touch + Footer</text>
  <text class="an" x="650" y="1470">Shared on every page. Theme is</text>
  <text class="an" x="650" y="1488">inherited from the page wrapper</text>
  <text class="an" x="650" y="1506">(black here, white on About/Demo).</text>
  <text class="an" x="650" y="1532">Copy swap · footer © Relai.</text>
</svg>
