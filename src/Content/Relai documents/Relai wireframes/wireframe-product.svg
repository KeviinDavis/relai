<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1880" viewBox="0 0 1000 1880" font-family="Helvetica, Arial, sans-serif">
  <style>
    .frame { fill:#ffffff; stroke:#cfcfcf; stroke-width:1; }
