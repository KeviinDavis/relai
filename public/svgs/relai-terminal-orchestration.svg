<!-- PALETTE
     page #000000  surface #20231F  fg #FFFFFF  muted #737373  accent #DE4A3B -->
<svg viewBox="0 0 512 640" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="512" height="640" fill="#20231F"/>

  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- berth tracks -->
    <line x1="150" y1="190" x2="472" y2="190" stroke="#737373" stroke-width="1"/>
    <line x1="150" y1="290" x2="472" y2="290" stroke="#737373" stroke-width="1"/>
    <line x1="150" y1="390" x2="472" y2="390" stroke="#737373" stroke-width="1"/>
    <line x1="150" y1="490" x2="472" y2="490" stroke="#737373" stroke-width="1"/>

    <!-- scheduled bars -->
    <rect x="170" y="182" width="80"  height="16" stroke="#737373" stroke-width="1"/>
    <rect x="270" y="182" width="110" height="16" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="190" y="282" width="130" height="16" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="150" y="382" width="60"  height="16" stroke="#737373" stroke-width="1"/>
    <rect x="300" y="382" width="150" height="16" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="250" y="482" width="140" height="16" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="410" y="482" width="60"  height="16" stroke="#737373" stroke-width="1"/>

    <!-- NOW line -->
    <line x1="300" y1="160" x2="300" y2="520" stroke="#DE4A3B" stroke-width="1.5"/>

    <!-- time axis -->
    <line x1="150" y1="540" x2="472" y2="540" stroke="#737373" stroke-width="1"/>
    <line x1="150" y1="540" x2="150" y2="546" stroke="#737373" stroke-width="1"/>
    <line x1="230" y1="540" x2="230" y2="546" stroke="#737373" stroke-width="1"/>
    <line x1="310" y1="540" x2="310" y2="546" stroke="#737373" stroke-width="1"/>
    <line x1="390" y1="540" x2="390" y2="546" stroke="#737373" stroke-width="1"/>
    <line x1="472" y1="540" x2="472" y2="546" stroke="#737373" stroke-width="1"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#FFFFFF" font-size="12" letter-spacing="1.4">TERMINAL ORCHESTRATION</text>
    <text x="40" y="64" fill="#737373" font-size="9" letter-spacing="1">BERTH SCHEDULE · LIVE</text>

    <text x="40" y="194" fill="#737373" font-size="9" letter-spacing="1">BERTH 1</text>
    <text x="40" y="294" fill="#737373" font-size="9" letter-spacing="1">BERTH 2</text>
    <text x="40" y="394" fill="#737373" font-size="9" letter-spacing="1">BERTH 3</text>
    <text x="40" y="494" fill="#737373" font-size="9" letter-spacing="1">BERTH 4</text>

    <text x="300" y="152" fill="#DE4A3B" font-size="9" letter-spacing="1.4" text-anchor="middle">NOW</text>

    <text x="150" y="558" fill="#737373" font-size="8" letter-spacing="1" text-anchor="start">00:00</text>
    <text x="230" y="558" fill="#737373" font-size="8" letter-spacing="1" text-anchor="middle">06:00</text>
    <text x="310" y="558" fill="#737373" font-size="8" letter-spacing="1" text-anchor="middle">12:00</text>
    <text x="390" y="558" fill="#737373" font-size="8" letter-spacing="1" text-anchor="middle">18:00</text>
    <text x="472" y="558" fill="#737373" font-size="8" letter-spacing="1" text-anchor="end">24:00</text>
  </g>
</svg>
