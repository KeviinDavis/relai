<!-- PALETTE
     page #000000  surface #20231F  fg #FFFFFF  muted #737373  accent #DE4A3B -->
<svg viewBox="0 0 512 640" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="512" height="640" fill="#20231F"/>

  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- axis guides -->
    <line x1="130" y1="232" x2="130" y2="556" stroke="#737373" stroke-width="0.5"/>
    <line x1="430" y1="232" x2="430" y2="556" stroke="#737373" stroke-width="0.5" opacity="0.5"/>

    <!-- legend swatches -->
    <rect x="300" y="120" width="14" height="10" stroke="#737373" stroke-width="1"/>
    <rect x="300" y="138" width="14" height="10" stroke="#DE4A3B" stroke-width="1.5"/>

    <!-- SEA -->
    <rect x="130" y="248" width="300" height="12" stroke="#737373" stroke-width="1"/>
    <rect x="130" y="265" width="264" height="12" stroke="#DE4A3B" stroke-width="1.5"/>
    <!-- PORT -->
    <rect x="130" y="338" width="300" height="12" stroke="#737373" stroke-width="1"/>
    <rect x="130" y="355" width="228" height="12" stroke="#DE4A3B" stroke-width="1.5"/>
    <!-- YARD -->
    <rect x="130" y="428" width="300" height="12" stroke="#737373" stroke-width="1"/>
    <rect x="130" y="445" width="252" height="12" stroke="#DE4A3B" stroke-width="1.5"/>
    <!-- ROAD -->
    <rect x="130" y="518" width="300" height="12" stroke="#737373" stroke-width="1"/>
    <rect x="130" y="535" width="240" height="12" stroke="#DE4A3B" stroke-width="1.5"/>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#FFFFFF" font-size="12" letter-spacing="1.4">EMISSIONS &amp; IDLE</text>
    <text x="40" y="64" fill="#737373" font-size="9" letter-spacing="1">CO2 PER LEG · COORDINATED VS BASELINE</text>

    <!-- headline -->
    <text x="40" y="150" fill="#FFFFFF" font-size="46">−18%</text>
    <text x="40" y="172" fill="#737373" font-size="9" letter-spacing="1.4">AVG IDLE REDUCTION</text>

    <!-- legend text -->
    <text x="322" y="129" fill="#737373" font-size="8" letter-spacing="1">BASELINE</text>
    <text x="322" y="147" fill="#737373" font-size="8" letter-spacing="1">COORDINATED</text>

    <!-- leg labels -->
    <text x="40" y="259" fill="#FFFFFF" font-size="10" letter-spacing="1">SEA</text>
    <text x="40" y="349" fill="#FFFFFF" font-size="10" letter-spacing="1">PORT</text>
    <text x="40" y="439" fill="#FFFFFF" font-size="10" letter-spacing="1">YARD</text>
    <text x="40" y="529" fill="#FFFFFF" font-size="10" letter-spacing="1">ROAD</text>

    <!-- per-leg reductions -->
    <text x="472" y="272" fill="#737373" font-size="9" text-anchor="end">−12%</text>
    <text x="472" y="362" fill="#737373" font-size="9" text-anchor="end">−24%</text>
    <text x="472" y="452" fill="#737373" font-size="9" text-anchor="end">−16%</text>
    <text x="472" y="542" fill="#737373" font-size="9" text-anchor="end">−20%</text>

    <!-- scale ref -->
    <text x="430" y="226" fill="#737373" font-size="7" letter-spacing="1" text-anchor="middle">100</text>
  </g>
</svg>
